[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[input.prepend_keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on = ["g", "P"]
run = "cd ~/Documents/Projects/"
desc = "跳转到 Documents/projects"

[[mgr.prepend_keymap]]
on = ["g", "C"]
run = "cd ~/Documents/code"
desc = "跳转到 Documents/code"
